[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ner-system"
version = "0.1.0"
description = "DeBERTa-v3 BIO NER for PERSON / ORG / ADDRESS / COMMODITY with ONNX serving"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
inference = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
]
train = [
    "torch>=2.3",
    "transformers>=4.46",
    "datasets>=2.20",
    "accelerate>=0.33",
    "seqeval>=1.2.2",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
data = [
    "anthropic>=0.40",
    "psycopg[binary]>=3.1",
]
# Open-vocabulary commodity extraction. Pulls torch (~2GB) via gliner; the rest
# of the package stays importable without it (imports are lazy).
commodity = [
    "gliner>=0.2.20",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # numpy is imported directly by 4 test modules; without it `pytest` fails at
    # collection, so it belongs in the extra that claims to run the test suite.
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["ner*"]

[tool.setuptools.package-data]
# The HS vocabulary backing the open-vocabulary eval probe. Without this it is
# present in an editable install and missing from a built wheel.
"ner.commodity" = ["resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
